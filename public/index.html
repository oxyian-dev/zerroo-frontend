<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <link rel="apple-touch-icon" href="/victory.png" />
        <link rel="icon" href="/victory.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />

        <title th:text="${title}">Victory World</title>
        <meta th:content="${title}" name="title" content="Victory World" />
        <meta th:content="${description}" name="description" content="Victory World" />

        <meta
            th:content="${keywords}"
            name="keywords"
            content="Victory World,business,earn money,ecommerce,shopping,store,tshirt,shirt,pant,kurti,entrepreneurship"
        />
        <meta th:content="${og_title}" property="og:title" content="Victory World" />
        <meta
            th:content="${og_url}"
            property="og:url"
            content="https://www.victoryworld.in"
        />
        <meta
            th:content="${og_description}"
            property="og:description"
            content="Victory World"
        />
        <meta
            th:content="${og_image}"
            property="og:image"
            content="https://www.victoryworld.in/og.png"
        />
        <meta content="website" property="og:type" />
        <link th:href="${url}" rel="canonical" href="https://www.victoryworld.in" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <main id="root"></main>
    </body>
</html>
